<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Edulink</title>
  <meta name="description" content="Edulink — plateforme pédagogique de MBN Global Education." />
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#10233f;background:#f6f8fb}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
    main{width:min(720px,100%);background:#fff;border:1px solid #e5eaf2;border-radius:22px;padding:42px;box-shadow:0 16px 42px rgba(16,35,63,.08)}
    .badge{display:inline-flex;padding:8px 12px;border-radius:999px;background:#eaf2ff;color:#1f5eff;font-weight:700;font-size:13px}
    h1{font-size:clamp(42px,8vw,68px);line-height:1;margin:22px 0 14px;letter-spacing:-.04em}
    p{font-size:17px;line-height:1.7;color:#5a687d;margin:0}.status{margin-top:26px;padding:16px;border-radius:14px;background:#f8fafc;color:#334155;font-size:14px}
  </style>
</head>
<body>
  <main>
    <span class="badge">MBN Global Education</span>
    <h1>Edulink</h1>
    <p>Plateforme pédagogique Bachelor 3. Le déploiement Netlify est initialisé ; le code applicatif complet, Supabase et Google Classroom seront raccordés à ce projet.</p>
    <div class="status">Environnement de production Netlify en cours de raccordement.</div>
  </main>
</body>
</html>
